apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-config: reads .env at build time and makes every key available
// to Kotlin (BuildConfig), to the manifest (manifestPlaceholders) and to JS.
// A changed .env therefore needs a rebuild, not just a Metro reload.
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * R8 on release builds: shrinks and obfuscates the bytecode and strips unused
 * resources — a smaller download, and harder-to-read code shipped to every
 * phone. Everything that is looked up by reflection is kept in
 * proguard-rules.pro (react-native-config's BuildConfig in particular: without
 * that rule a release build cannot read its own .env and crashes on launch).
 */
def enableProguardInReleaseBuilds = true

/**
 * Release identity, read from the repo-root app.json so JS (the settings
 * footer) and Android always agree. `buildNumber` must go up on every Play
 * upload; see docs/RELEASE.md.
 */
def appJson = new groovy.json.JsonSlurper().parse(rootProject.file("../app.json"))
def appVersionName = appJson.version ?: "1.0.0"
def appVersionCode = (appJson.buildNumber ?: 1) as Integer

/**
 * Release signing — the UPLOAD key for Play App Signing.
 *
 * Read from android/keystore.properties (git-ignored) or, in CI, from the
 * TERRAWARS_UPLOAD_* environment variables. Never committed, never the debug
 * key: Play rejects a debug-signed bundle, and a release signed with the
 * public debug key could be re-signed by anyone.
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningValue = { String propertyName, String envName ->
    keystoreProperties.getProperty(propertyName) ?: System.getenv(envName)
}
def releaseStoreFile = releaseSigningValue("storeFile", "TERRAWARS_UPLOAD_STORE_FILE")
def hasReleaseSigning = releaseStoreFile != null && file(releaseStoreFile).exists()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.terrawars"
    defaultConfig {
        applicationId "com.terrawars"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName

        // Substituted into AndroidManifest.xml. The `?:` fallback keeps a
        // checkout without a .env buildable — the map just renders blank tiles,
        // which is a far clearer failure than a manifest merge error.
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY_ANDROID: (project.env.get("GOOGLE_MAPS_API_KEY_ANDROID") ?: "")
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseSigningValue("storePassword", "TERRAWARS_UPLOAD_STORE_PASSWORD")
                keyAlias releaseSigningValue("keyAlias", "TERRAWARS_UPLOAD_KEY_ALIAS")
                keyPassword releaseSigningValue("keyPassword", "TERRAWARS_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The upload key when configured. Without it a release APK is still
            // signed with the debug key so it can be installed for local
            // testing — but a Play bundle cannot be built that way; see the
            // bundleRelease guard below.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// A bundle is only ever built to upload to Play, and Play rejects a
// debug-signed one outright. Fail at the start of the build with the fix,
// rather than minutes later in the Play Console.
gradle.taskGraph.whenReady { graph ->
    def buildsReleaseBundle = graph.allTasks.any { it.name == "bundleRelease" }
    if (buildsReleaseBundle && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured. Create android/keystore.properties " +
            "(storeFile, storePassword, keyAlias, keyPassword) or set the " +
            "TERRAWARS_UPLOAD_* environment variables — see docs/RELEASE.md."
        )
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // FusedLocationProviderClient, used by WalkTrackingService. Pinned rather
    // than open-ranged: a silent Play Services bump is not something you want
    // landing in the one component NFR-01 and Phase 2 depend on.
    implementation("com.google.android.gms:play-services-location:21.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
